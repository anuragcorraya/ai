<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Assistant (Working)</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- JSZip & FileSaver for Zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .chat-container { height: 65vh; overflow-y: auto; scroll-behavior: smooth; }
        .code-block-wrapper { position: relative; margin: 15px 0; }
        .copy-button {
            position: absolute; top: 8px; right: 8px;
            background: #334155; color: #f8fafc; padding: 4px 10px;
            border-radius: 5px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .copy-button:hover { background: #475569; }
        pre code { border-radius: 8px !important; font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-gray-900 rounded-xl shadow-2xl overflow-hidden border border-gray-800">
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-400">Laguna AI Code Agent</h2>
            <button onclick="downloadAllCodesAsZip()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                Download All Code (.ZIP)
            </button>
        </div>

        <!-- Chat Area -->
        <div id="chat-box" class="chat-container p-6 space-y-4">
            <div class="bg-gray-800 p-4 rounded-lg inline-block max-w-[80%]">
                হ্যালো! আমি আপনাকে কোড লিখে দিতে পারি। আপনি চাইলে আমি সব কোড জিপ করে দিতে পারবো।
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-800 border-t border-gray-700">
            <div class="flex gap-3">
                <textarea id="user-input" rows="2" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500" placeholder="এখানে লিখুন (যেমন: একটি লগইন পেজ তৈরি করে দাও)..."></textarea>
                <button id="send-btn" onclick="askAI()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition self-end">
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        // আপনার API Key এখানে দিন
        const OPENROUTER_API_KEY = "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";
        
        let allCodeBlocks = []; // সব কোড সেভ করার জন্য

        function appendMessage(role, content) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = role === 'user' ? 'text-right' : 'text-left';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `inline-block p-4 rounded-lg text-left ${role === 'user' ? 'bg-blue-700 text-white' : 'bg-gray-800 border border-gray-700 text-gray-200'} max-w-[90%] shadow-md`;
            
            if (role === 'ai') {
                // Markdown পার্স করা
                const htmlContent = marked.parse(content);
                msgDiv.innerHTML = htmlContent;
                
                // কোড ব্লকে কপি বাটন অ্যাড করা
                msgDiv.querySelectorAll('pre code').forEach((codeBlock) => {
                    const code = codeBlock.innerText;
                    allCodeBlocks.push(code); // জিপের জন্য স্টোর করা
                    
                    const container = document.createElement('div');
                    container.className = 'code-block-wrapper';
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.innerText = 'Copy';
                    copyBtn.className = 'copy-button';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(code);
                        copyBtn.innerText = 'Copied!';
                        setTimeout(() => copyBtn.innerText = 'Copy', 2000);
                    };
                    
                    codeBlock.parentNode.parentNode.insertBefore(container, codeBlock.parentNode);
                    container.appendChild(codeBlock.parentNode);
                    container.appendChild(copyBtn);
                });
            } else {
                msgDiv.innerText = content;
            }

            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // হাইলাইট কোড
            hljs.highlightAll();
        }

        async function askAI() {
            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');
            const prompt = input.value.trim();

            if (!prompt) return;

            appendMessage('user', prompt);
            input.value = '';
            btn.disabled = true;
            btn.innerText = '...';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "HTTP-Referer": window.location.href, // OpenRouter এর জন্য প্রয়োজন
                        "X-Title": "AI Assistant", 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "poolside/laguna-s-2.1:free",
                        "messages": [{ "role": "user", "content": prompt }]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    appendMessage('ai', data.choices[0].message.content);
                } else {
                    appendMessage('ai', "Error: API থেকে সঠিক রেসপন্স পাওয়া যায়নি। আপনার API Key চেক করুন।");
                }

            } catch (error) {
                console.error(error);
                appendMessage('ai', "সার্ভারে কানেক্ট করতে সমস্যা হচ্ছে। ইন্টারনেট চেক করুন।");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send';
            }
        }

        // জিপ ফাইল তৈরি এবং ডাউনলোড ফাংশন
        function downloadAllCodesAsZip() {
            if (allCodeBlocks.length === 0) {
                alert("ডাউনলোড করার মতো কোনো কোড এখনো জেনারেট হয়নি!");
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder("generated_codes");

            allCodeBlocks.forEach((code, index) => {
                // ফাইলের ভাষা বোঝার চেষ্টা (সরল পদ্ধতি)
                let ext = "txt";
                if (code.includes("<!DOCTYPE html>") || code.includes("<html>")) ext = "html";
                else if (code.includes("{") && code.includes("color:")) ext = "css";
                else if (code.includes("function") || code.includes("const ")) ext = "js";

                folder.file(`file_${index + 1}.${ext}`, code);
            });

            zip.generateAsync({ type: "blob" }).then(function (content) {
                saveAs(content, "AI_Codes_Project.zip");
            });
        }
    </script>
</body>
</html>
